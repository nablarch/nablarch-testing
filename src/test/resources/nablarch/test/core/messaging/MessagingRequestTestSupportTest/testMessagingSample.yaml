list_maps:
  - id: "testCases"
    rows:
      - no: "1"
        case: "ユーザ登録"
        requestId: ""
        userId: ""
        setUpTable: "input"
        expectedStatusCode: "200"
        expectedTable: "case1"
        expectedLog: "case1"
        diConfig: "file:./java/nablarch/test/core/messagig/sample/diConfig.xml"
      - no: "2"
        case: "ユーザ登録"
        requestId: ""
        userId: ""
        setUpTable: "input"
        expectedStatusCode: "400"
        expectedTable: "case2"
        expectedLog: "case2"
        diConfig: "nablarch/test/core/messagig/sample/diConfig.xml"
  - group_id: "case1"
    id: "expectedLog"
    rows:
      - MSG: "会員ID[0001]を採番しました"
        LEVEL: "INFO"
      - MSG: "正常終了しました。終了コード=[200]"
        LEVEL: "INFO"
  - group_id: "case2"
    id: "EXPECTED_LOG"
    rows:
      - MSG: "処理開始します。リクエストID=[AB12345678]"
        LEVEL: "TRACE"
      - MSG: "会員ID[0001]を採番しました。"
        LEVEL: "INFO"
      - MSG: "MSG01233455"
        LEVEL: "ERROR"
messages:
  - id: "setUpMessages"
    directives:
      text-encoding: "Windows-31J"
    records:
    - record_type: "default"
      fields:
        - {name: "ユーザ名", type: "全角"}
        - {name: "備考", type: "全角"}
        - {name: "FILLER", type: "半角"}
      rows:
        - ["電文太郎", "特筆なし", ""]
        - ["", "ユーザ名が空欄なのでエラーが発生します。", ""]
  - id: "expectedMessages"
    records:
    - record_type: "default"
      fields:
        - {name: "処理結果コード", type: "半角"}
        - {name: "会員ID", type: "半角"}
        - {name: "FILLER", type: "半角"}
      rows:
        - ["00", "1234567890", ""]
        - ["01", "", ""]
setup_tables:
  - group_id: "input"
    table: "USERS"
    rows: []
  - group_id: "input"
    table: "ID_GENERATE"
    rows:
      - ID: "01"
        NO: "0"
expected_tables:
  - group_id: "case1"
    table: "SYSTEM_ACCOUNT"
    rows:
      - ID: "1"
        NAME: "電文太郎"
        REMARKS: "特筆なし"
  - group_id: "case2"
    table: "SYSTEM_ACCOUNT"
    rows: []
