# YamlTestDataReaderTest 用テストデータ

setup_tables:
  - table: USER
    rows:
      - USER_ID: "001"
        USER_NAME: "山田太郎"
        AGE: "30"
        MEMO: null

  - group_id: case1
    table: ORDER
    rows:
      - ORDER_ID: "1001"
        USER_ID: "001"
        AMOUNT: "5000"
        STATUS: ""

list_maps:
  - id: params
    rows:
      - KEY1: "val1"
        KEY2: "val2"
      - KEY1: "val3"
        KEY2: "val4"

setup_files:
  - path: input/data.dat
    type: fixed
    directives:
      text-encoding: MS932
    records:
      - record_type: DATA
        fields:
          - name: USER_ID
            type: X
            length: "10"
          - name: USER_NAME
            type: N
            length: "20"
        rows:
          - ["001", "山田太郎"]
          - ["002", "鈴木花子"]
