list_maps:
  - id: "testShots"
    rows:
      - no: "1"
        description: "ユーザ登録"
        diConfig: "nablarch/test/core/messaging/sample/diConfig.xml"
        setUpTable: "default"
        expectedStatusCode: "200"
        expectedTable: "default"
        expectedLog: ""
messages:
  - id: "setUpMessages"
    directives:
      text-encoding: "Windows-31J"
    fw_header:
      requestId: "Greeting"
      userId: "hoge"
    records:
    - record_type: "default"
      fields:
        - {name: "メッセージ", type: "半角"}
      rows:
        - ["Kawasaki"]
  - id: "expectedMessages"
    records:
    - record_type: "default"
      fields:
        - {name: "処理結果コード", type: "半角"}
      rows:
        - ["Hello, Kawasaki"]
setup_tables:
  - table: "TEST_TABLE"
    rows:
      - PK_COL1: "00001"
        PK_COL2: "11"
        varchar2_col: "いいい"
        null_col: "null"
expected_tables:
  - table: "TEST_TABLE"
    rows:
      - PK_COL1: "00001"
        PK_COL2: "11"
        varchar2_col: "あああ"
        null_col: "null"
