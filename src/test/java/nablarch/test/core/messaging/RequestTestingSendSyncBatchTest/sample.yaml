list_maps:
  - id: "testShots"
    rows:
      - no: "1"
        description: "データベースから読み込んだ内容が、正しくメッセージとして送信されること。また、返却されたメッセージが正しくデータベースに登録されること。"
        expectedStatusCode: "0"
        expectedLog: ""
        diConfig: "batch-test-component-configuration.xml"
        requestPath: "BM21AA0101"
        userId: "batch_user"
        expectedMessage: "case1"
        responseMessage: "case1"
      - no: "2"
        description: "メッセージ送信先から、精査エラーメッセージが返却された場合に、処理が終了し、エラーログが出力されること。"
        expectedStatusCode: "0"
        expectedLog: "expectedLog1"
        diConfig: "batch-test-component-configuration.xml"
        requestPath: "BM21AA0102"
        userId: "batch_user"
        expectedMessage: "case2"
        responseMessage: "case2"
      - no: "3"
        description: "メッセージ送信先から、送信したユーザ情報の登録エラーメッセージが返却された場合に、処理が終了し、エラーログが出力されること。"
        expectedStatusCode: "20"
        expectedLog: "expectedLog1"
        diConfig: "batch-test-component-configuration.xml"
        requestPath: "BM21AA0103"
        userId: "batch_user"
        expectedMessage: "case3"
        responseMessage: "case1"
  - id: "expectedLog1"
    rows:
      - logLevel: "WARN"
        message1: "caused by timeout, failed to send message. requestId = [RM21AA0101], retryCount = [0]"
  - id: "expectedLog2"
    rows:
      - logLevel: "WARN"
        message1: "mesasge exception was happend! this exception was thrown by mock."
