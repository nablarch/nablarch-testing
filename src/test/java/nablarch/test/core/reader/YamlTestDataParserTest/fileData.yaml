# RS-01: {dataName}.yaml ファイルを検索する
# RS-07: readLine() が null を返した後、直前のセクションデータが欠落しない

setup_files:
  - path: dummy/setup_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
            length: 5
          - name: FIELD2
            type: 半角
            length: 5
        rows:
          - ["AAAAA", "BBBBB"]
          - ["CCCCC", "DDDDD"]

  - group_id: grp1
    path: dummy/setup_fixed_grp.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
            length: 3
        rows:
          - ["AAA"]

  - path: dummy/setup_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: 半角
          - name: VALUE
            type: 半角
        rows:
          - ["田中", "100"]

expected_files:
  - path: dummy/expected_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: RESULT
        fields:
          - name: CODE
            type: 半角
            length: 4
          - name: MSG
            type: 半角
            length: 4
        rows:
          - ["0000", "OKAY"]

  - path: dummy/expected_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: 半角
          - name: VALUE
            type: 半角
        rows:
          - ["鈴木", "200"]
