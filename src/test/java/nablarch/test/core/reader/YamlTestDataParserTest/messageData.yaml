            type: 半角
            length: 1
          - name: resultCode
            type: 半角
            length: 4
        rows:
          - ["0000000001", "testUser01", "0", "0000"]

expected_request_body_messages:
  - id: req001
    records:
      - record_type: BODY
        fields:
          - name: SEARCH_KEY
            type: 半角
            length: 10
        rows:
          - ["SEARCHKEY1"]

response_body_messages:
