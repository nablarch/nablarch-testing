      text-encoding: Windows-31J
    fw_header:
      requestId: "0000000001"
      userId: "testUser01"
      resendFlag: "0"
      resultCode: "0000"
    records:
      - record_type: BODY
        fields:
          - name: SEARCH_KEY
            type: 半角
            length: 10
        rows:
          - ["SEARCHKEY1"]

