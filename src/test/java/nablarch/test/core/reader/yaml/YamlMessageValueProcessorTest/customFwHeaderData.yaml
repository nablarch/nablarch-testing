# プロジェクト独自キーを含む fw_header マップテスト用（T2 手順6）
# fwHeaderFields フィルタが廃止され、fw_header に記述した全キーが保持されることを検証する

messages:
  - id: req001
    directives:
      text-encoding: Windows-31J
    fw_header:
      customField: "CUSTOM_VALUE"
      requestId: "0000000001"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]
