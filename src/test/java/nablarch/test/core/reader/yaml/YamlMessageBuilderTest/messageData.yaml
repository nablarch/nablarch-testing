# getMessage / getMessageWithoutCache テスト用

messages:
  - id: req001
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: FW_HEADER
        fields:
          - name: requestId
            type: X
            length: 10
          - name: userId
            type: X
            length: 10
          - name: resendFlag
            type: X
            length: 1
          - name: resultCode
            type: X
            length: 4
        rows:
          - ["0000000001", "testUser01", "0", "0000"]
      - record_type: BODY
        fields:
          - name: SEARCH_KEY
            type: X
            length: 10
        rows:
          - ["SEARCHKEY1"]

