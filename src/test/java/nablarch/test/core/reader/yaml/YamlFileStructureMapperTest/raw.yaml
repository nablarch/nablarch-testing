# YamlFileStructureMapper の構造層直接テスト用。
# 値加工層を通さず RawDataFile/RawRecordLayout/RawFieldDef を直接検証するため、
# 記法・長さ省略・record_type 省略・FW_HEADER 保持・空文字・マーカー・複数文字セパレータ等の
# 端点を 1 ファイルに集約する。

setup_files:
  # 固定長: directives 保持・length あり・${...} 未加工・空文字 "" 保持・マーカー列名保持
  - path: dummy/setup_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: 半角
            length: 5
          - name: "[MARKER]"
            type: 半角
            length: 3
        rows:
          - ["${userId}", ""]

  # 可変長: length 省略（→ RawFieldDef.getLength()==null）・2 文字セパレータも検証せず未加工保持
  - group_id: grpVar
    path: dummy/setup_variable.csv
    type: variable
    directives:
      field-separator: ","
      multi-char-sep: ",,"
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: 半角
          - name: VALUE
            type: 半角
        rows:
          - ["田中", "100"]

  # record_type 省略（→ RawRecordLayout.getRecordType()==null）
  - group_id: noRecordType
    path: dummy/no_rt.dat
    type: fixed
    records:
      - fields:
          - name: F1
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  # 複数レコード: FW_HEADER → DATA の順序保持（FW_HEADER もスキップせず保持＝スキップは値加工層の責務）
  - group_id: multiRecord
    path: input/multi.dat
    type: fixed
    records:
      - record_type: FW_HEADER
        fields:
          - name: SEQ
            type: 半角
            length: 4
        rows:
          - ["H001"]
      - record_type: DATA
        fields:
          # length に "-" リテラル（自動拡張記法）を未加工で保持
          - name: BODY
            type: 半角
            length: "-"
        rows:
          - ["X"]

  # path 省略（→ RawDataFile.getPath()==null・例外を投げない＝必須チェックは値加工層）
  - group_id: missingPath
    type: fixed
    records:
      - record_type: DATA
        fields:
          - name: F1
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

  # records 空（→ 空リスト保持）
  - group_id: emptyFile
    path: input/empty.dat
    type: fixed
    records: []
