setup_tables:
  - table: test_table
    rows:
      - "[NO]": "1"
        Pk_Col1: "${updateTime}"
        Mixed_Case: "plain"
        NullCol: null
        EmptyCol: ""

  - group_id: g1
    table: test_table
    rows:
      - Pk_Col1: "v1"
      - {}
      - Pk_Col1: "v2"

  - group_id: emptyRows
    table: test_table
    rows: []

  - group_id: missingTable
    rows:
      - Pk_Col1: "x"

list_maps:
  - id: lm1
    rows:
      - zebra: "${z}"
        alpha: "a"
        "[MK]": "m"
