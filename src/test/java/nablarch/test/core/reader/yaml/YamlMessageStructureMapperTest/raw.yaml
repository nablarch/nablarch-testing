# YamlMessageStructureMapper の構造層直接テスト用。
# 値加工層を通さず RawMessage を直接検証する。fw_header はマップであることを構造層では検証せず
# 生の Object のまま保持し（誤記エントリの巻き添え回避＝旧挙動）、FW_HEADER レコードもスキップしない、
# length 省略は null、record_type 省略は null、${...} 未加工、を確認する。

messages:
  # fw_header マップ（検証はせず生の Map を保持）・${...} 未加工・directives 保持
  - id: req001
    directives:
      text-encoding: Windows-31J
    fw_header:
      requestId: "${rid}"
      userId: "user01"
    records:
      - record_type: BODY
        fields:
          - name: SEARCH_KEY
            type: 半角
            length: 10
        rows:
          - ["${key}"]

  # fw_header がリスト（誤記）→ 構造層は例外を投げず生の List を保持
  - id: malformed001
    fw_header:
      - requestId: "0000000001"
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 10
        rows:
          - ["TESTDATA1"]

  # fw_header 省略 → null
  - id: bodyOnly001
    records:
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]

# FW_HEADER record_type をスキップせず保持・length 省略は null・record_type 省略は null
expected_request_header_messages:
  - id: req001
    records:
      - record_type: FW_HEADER
        fields:
          - name: requestId
            type: 半角
            length: 10
        rows:
          - ["0000000001"]
      - fields:
          # length 省略フィールド（→ getLength()==null）と record_type 省略レコード
          - name: NO_LEN
            type: 半角
        rows:
          - ["X"]

# group_id を持つ SendSync 用エントリ（構造層は group_id も未加工で保持）
response_body_messages:
  - group_id: grp1
    id: sync001
    records:
      - record_type: BODY
        fields:
          - name: RESULT_CODE
            type: 半角
            length: 4
        rows:
          - ["0000"]
