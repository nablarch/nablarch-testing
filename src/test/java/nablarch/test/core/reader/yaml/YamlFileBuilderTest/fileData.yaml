setup_files:
  - path: dummy/setup_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
            length: 5
          - name: FIELD2
            type: X
            length: 5
        rows:
          - ["AAAAA", "BBBBB"]

  - group_id: grp1
    path: dummy/setup_fixed_grp.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
            length: 3
        rows:
          - ["AAA"]

  - path: dummy/setup_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: X
          - name: VALUE
            type: X
        rows:
          - ["田中", "100"]

  - group_id: missingPath
    type: fixed
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
            length: 5
        rows:
          - ["HELLO"]

  - group_id: noRecordType
    path: dummy/no_record_type.dat
    type: fixed
    records:
      - fields:
          - name: FIELD1
            type: X
            length: 5
        rows:
          - ["HELLO"]

expected_files:
  - path: dummy/expected_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: RESULT
        fields:
          - name: CODE
            type: X
            length: 4
          - name: MSG
            type: X
            length: 4
        rows:
          - ["0000", "OKAY"]

  - path: dummy/expected_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: X
          - name: VALUE
            type: X
        rows:
          - ["鈴木", "200"]
