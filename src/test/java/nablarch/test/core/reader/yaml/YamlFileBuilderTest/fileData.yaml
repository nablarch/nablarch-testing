setup_files:
  - path: dummy/setup_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
            length: 5
          - name: FIELD2
            type: X
            length: 5
        rows:
          - ["AAAAA", "BBBBB"]

  - group_id: grp1
    path: dummy/setup_fixed_grp.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
            length: 3
        rows:
          - ["AAA"]

  - path: dummy/setup_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: X
          - name: VALUE
            type: X
        rows:
          - ["田中", "100"]

  - group_id: missingPath
    type: fixed
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
            length: 5
        rows:
          - ["HELLO"]

  - group_id: noRecordType
    path: dummy/no_record_type.dat
    type: fixed
    records:
      - fields:
          - name: FIELD1
            type: X
            length: 5
        rows:
          - ["HELLO"]

  - group_id: multiRecord
    path: input/multi.dat
    type: fixed
    records:
      - record_type: HEADER
        fields:
          - name: SEQ
            type: X
            length: 4
          - name: TYPE
            type: X
            length: 2
        rows:
          - ["H001", "01"]
      - record_type: DATA
        fields:
          - name: USER_ID
            type: X
            length: 10
          - name: AMOUNT
            type: Z
            length: 10
          - name: NOTE
            type: N
            length: 20
        rows:
          - ["001", "5000", "備考"]

  - group_id: emptyFile
    path: input/empty.dat
    type: fixed
    directives:
      text-encoding: MS932
    records: []

expected_files:
  - path: dummy/expected_fixed.dat
    type: fixed
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: RESULT
        fields:
          - name: CODE
            type: X
            length: 4
          - name: MSG
            type: X
            length: 4
        rows:
          - ["0000", "OKAY"]

  - path: dummy/expected_variable.csv
    type: variable
    directives:
      text-encoding: UTF-8
      field-separator: ","
    records:
      - record_type: DATA
        fields:
          - name: NAME
            type: X
          - name: VALUE
            type: X
        rows:
          - ["鈴木", "200"]

  - group_id: twoCharSeparator
    path: dummy/two_char.csv
    type: variable
    directives:
      field-separator: ",,"
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
        rows:
          - ["A"]

  - group_id: tabSeparator
    path: dummy/tab_separated.tsv
    type: variable
    directives:
      field-separator: "\\t"
    records:
      - record_type: DATA
        fields:
          - name: FIELD1
            type: X
          - name: FIELD2
            type: X
        rows:
          - ["A", "B"]

