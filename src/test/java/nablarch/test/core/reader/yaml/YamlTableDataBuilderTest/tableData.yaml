setup_tables:
  - table: TEST_TABLE
    rows:
      - PK_COL1: "0000000001"
        PK_COL2: "AB"
        VARCHAR2_COL: "あいうえお"
        NUMBER_COL: "1"
        NUMBER_COL2: "1.1"

  - group_id: groupA
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000002"
        PK_COL2: "CD"
        VARCHAR2_COL: "かきくけこ"
        NUMBER_COL: "2"
        NUMBER_COL2: "2.2"

  - group_id: emptyRows
    table: TEST_TABLE
    rows: []

  - group_id: dupTable
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000010"
        PK_COL2: "EF"
        VARCHAR2_COL: "さしすせそ"
        NUMBER_COL: "10"
        NUMBER_COL2: "10.1"

  - group_id: dupTable
    table: TEST_TABLE
    rows:
      - PK_COL1: "0000000011"
        PK_COL2: "GH"
        VARCHAR2_COL: "たちつてと"
        NUMBER_COL: "11"
        NUMBER_COL2: "11.1"

  - group_id: missingTable
