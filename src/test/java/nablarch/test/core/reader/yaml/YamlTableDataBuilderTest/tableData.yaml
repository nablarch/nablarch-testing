      - PK_COL1: "0000000099"
        PK_COL2: "XX"

  - group_id: markerColInTable
    table: TEST_TABLE
    rows:
      - "[NO]": "1"
        PK_COL1: "0000000001"
        PK_COL2: "AB"
        VARCHAR2_COL: "test"
        NUMBER_COL: "1"
        NUMBER_COL2: "1.1"

