# reader.fwHeaderfields カスタム設定テスト用（QA-4）
# customField のみを FW ヘッダとして抽出することを検証する

messages:
  - id: req001
    directives:
      text-encoding: Windows-31J
    records:
      - record_type: FW_HEADER
        fields:
          - name: customField
            type: 半角
            length: 12
          - name: requestId
            type: 半角
            length: 10
        rows:
          - ["CUSTOM_VALUE", "0000000001"]
      - record_type: BODY
        fields:
          - name: DATA
            type: 半角
            length: 5
        rows:
          - ["HELLO"]
