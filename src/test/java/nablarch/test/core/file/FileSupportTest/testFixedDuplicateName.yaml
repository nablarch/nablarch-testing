setup_files:
  - path: "work/testVariation.txt"
    type: fixed
    directives:
      text-encoding: "Windows-31J"
      record-separator: "CRLF"
    records:
    - record_type: "データ"
      fields:
        - {name: "あああ", type: "半角英字", length: "2"}
        - {name: "いいい", type: "半角数字", length: "2"}
        - {name: "いいい", type: "半角記号", length: "3"}
        - {name: "いいい", type: "半角数字", length: "4"}
      rows:
        - ["AB", "12", "#$", "24"]
