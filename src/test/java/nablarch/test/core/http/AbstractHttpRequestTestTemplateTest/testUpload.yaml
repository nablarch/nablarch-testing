list_maps:
  - id: "user"
    rows:
      - REQUEST_ID: "USERS00302"
        USER_ID: "US00000001"
  - id: "testCases"
    rows:
      - no: "1"
        case: "アップロード"
        context: "user"
        isValidToken: "true"
        setUpTable: ""
        expectedStatusCode: "200"
        expectedMessageId: ""
        expectedSearch: ""
        expectedTable: ""
        forwardUri: ""
  - id: "requestParams"
    rows:
      - param: "aaa"
        file1: "${attach:work/foo.txt},${attach:work/bar.txt}"
        file2: "${attach:work/buz.txt}"
setup_files:
  - path: "work/foo.txt"
    type: fixed
    directives:
      text-encoding: "Windows-31J"
      record-separator: "CRLF"
    records:
    - record_type: "データ"
      fields:
        - {name: "ID", type: "半角", length: "5"}
        - {name: "COUNTER", type: "数値", length: "5"}
        - {name: "MESSAGE", type: "半角", length: "10"}
      rows:
        - ["10001", "10", "hello"]
        - ["10002", "20", "good bye."]
  - path: "work/buz.txt"
    type: fixed
    directives:
      text-encoding: "Windows-31J"
      record-separator: "CRLF"
    records:
    - record_type: "データ"
      fields:
        - {name: "ID", type: "半角", length: "5"}
        - {name: "COUNTER", type: "数値", length: "5"}
        - {name: "MESSAGE", type: "半角", length: "10"}
      rows:
        - ["10001", "10", "konichiha"]
        - ["10002", "20", "sayonara"]
  - path: "work/bar.txt"
    type: variable
    directives:
      text-encoding: "Windows-31J"
      record-separator: "CRLF"
      quoting-delimiter: "'"
    records:
    - record_type: "ヘッダ"
      fields:
        - {name: "レコード区分", type: "半角"}
        - {name: "FILLER", type: "半角"}
      rows:
        - ["1", ""]
    - record_type: "データ"
      fields:
        - {name: "レコード区分", type: "半角"}
        - {name: "カナ氏名", type: "半角カナ"}
        - {name: "漢字氏名", type: "全角漢字"}
        - {name: "ローマ字氏名", type: "半角英字"}
        - {name: "性別", type: "半角"}
        - {name: "FILLER", type: "半角"}
      rows:
        - ["2", "ﾍﾝｺｳｺﾞ ｶﾅｼﾒｲ", "変更後　漢字氏名", "Henkougo romaji", "1", ""]
    - record_type: "トレーラ"
      fields:
        - {name: "レコード区分", type: "半角"}
        - {name: "FILLER1", type: "半角"}
        - {name: "総件数", type: "数値"}
        - {name: "FILLER2", type: "半角"}
      rows:
        - ["8", "", "1", ""]
